<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPX Viewer</title>
    <meta name="description" content="" data-i18n-meta="app.description" />
    <meta name="theme-color" content="#219653" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./icons/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64x64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <style>
      .is-loading {
        visibility: hidden;
      }
    </style>
    <script type="module" src="./main.ts"></script>
  </head>
  <body class="is-loading">
    <div class="page">
      <main class="layout">
        <section class="panel" id="import-panel" data-state="expanded">
          <div class="brand">
            <h1>GPX Viewer</h1>
            <p class="tagline" data-i18n="header.tagline"></p>
          </div>
          <div class="panel-header">
            <div>
              <h2 data-i18n="panel.title"></h2>
            </div>
            <div class="panel-actions">
              <button
                id="toggle-panel"
                type="button"
                class="secondary icon-button"
                aria-expanded="true"
                data-i18n-aria-label="panel.hide"
              >
              </button>
            </div>
          </div>
          <div class="panel-body" id="import-body">
            <div class="input-group">
              <label for="gpx-file" data-i18n="label.fromFile"></label>
              <input id="gpx-file" type="file" accept=".gpx,application/gpx+xml" multiple />
            </div>
            <div class="input-group">
              <label for="gpx-url" data-i18n="label.fromUrl"></label>
              <input
                id="gpx-url"
                type="url"
                placeholder=""
                spellcheck="false"
                inputmode="url"
                data-i18n-placeholder="placeholder.gpxUrl"
              />
              <button id="load-url" type="button" data-i18n="btn.loadUrl"></button>
            </div>
            <div class="button-row">
              <button id="fit-data" type="button" class="secondary" data-i18n="btn.refit"></button>
              <button id="clear-map" type="button" class="secondary" data-i18n="btn.clear"></button>
            </div>
            <div class="input-group">
              <input
                id="search"
                type="search"
                spellcheck="false"
                autocomplete="off"
                data-i18n-placeholder="placeholder.search"
                data-i18n-aria-label="placeholder.search"
              />
            </div>
            <div class="input-group">
              <label class="checkbox">
                <input id="display-labels" type="checkbox" />
                <span data-i18n="label.displayLabels"></span>
              </label>
              <label class="checkbox">
                <input id="display-perimeters" type="checkbox" />
                <span data-i18n="label.displayPerimeters"></span>
              </label>
              <label class="checkbox">
                <input id="hide-found" type="checkbox" />
                <span data-i18n="label.hideFound"></span>
              </label>
            </div>
            <div class="input-group">
              <label data-i18n="label.filter"></label>
              <div id="type-filter" class="checkbox-grid"></div>
            </div>
            <div class="input-group">
              <label data-i18n="label.difficulty"></label>
              <div class="range-filter" data-key="difficulty">
                <select aria-label="min"></select>
                <span>–</span>
                <select aria-label="max"></select>
              </div>
            </div>
            <div class="input-group">
              <label data-i18n="label.terrain"></label>
              <div class="range-filter" data-key="terrain">
                <select aria-label="min"></select>
                <span>–</span>
                <select aria-label="max"></select>
              </div>
            </div>
          </div>
          <div class="panel-footer">
            <div class="input-group">
              <label for="language" data-i18n="label.language"></label>
              <select id="language"></select>
            </div>
            <div class="footer-links">
              <a
                class="ghost-link"
                href="https://github.com/Surfoo/gpxviewer/"
                target="_blank"
                rel="noopener noreferrer"
                data-i18n-aria-label="panel.github"
              >
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
              </a>
              <button
                id="about-button"
                type="button"
                class="ghost-link"
                data-i18n-aria-label="about.title"
              ></button>
            </div>
          </div>
        </section>

        <section class="map-shell">
          <div id="map"></div>
          <div id="status" class="status" data-i18n="status.ready"></div>

          <div id="popup" class="ol-popup">
            <a href="#" id="popup-closer" class="ol-popup-closer" data-i18n-aria-label="btn.close"></a>
            <div id="info-content"></div>
          </div>
        </section>
      </main>
      <button
        id="toggle-panel-floating"
        type="button"
        class="secondary icon-button panel-toggle-floating"
        aria-expanded="true"
        data-i18n-aria-label="panel.show"
      >
      </button>
    </div>
    <dialog id="about-dialog" class="about-dialog" aria-labelledby="about-title">
      <h2 id="about-title" data-i18n="about.title"></h2>
      <p data-i18n="about.intro"></p>
      <div id="about-credits"></div>
      <form method="dialog">
        <button type="submit" class="secondary" data-i18n="about.close"></button>
      </form>
    </dialog>
  </body>
</html>
