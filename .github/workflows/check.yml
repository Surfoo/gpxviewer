name: Code Quality Checks

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
  workflow_call: # also run by deploy.yml, so main is checked before every deploy

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Lint with Biome
        run: npx biome check .

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build (Vite)
        run: npm run build
